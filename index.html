<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Transflow RoadEditor — модель УДС</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="maplibre-gl.css" rel="stylesheet">
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: rgba(255,255,255,.93); border-radius: 10px;
    padding: 12px 16px; font: 13px/1.5 system-ui, sans-serif;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: 280px;
  }
  #panel h1 { margin: 0 0 6px; font-size: 15px; }
  .sw { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Модель УДС — Transflow RoadEditor</h1>
  <div><span class="sw" style="background:#b3172c"></span>0 — магистраль</div>
  <div><span class="sw" style="background:#e05c24"></span>1</div>
  <div><span class="sw" style="background:#e8a531"></span>2</div>
  <div><span class="sw" style="background:#4a76b8"></span>3</div>
  <div><span class="sw" style="background:#5d9e63"></span>4 — местная</div>
  <div><span class="sw" style="background:#8b8fa3"></span>5 — проезд, ─ ─ тоннель</div>
</div>
<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);
  const pmUrl = new URL("roads.pmtiles", location.href).href;

  const roadColor = ["match", ["get", "r"],
    0, "#b3172c", 1, "#e05c24", 2, "#e8a531",
    3, "#4a76b8", 4, "#5d9e63", "#8b8fa3"];
  const roadWidth = ["interpolate", ["linear"], ["zoom"],
    10, ["+", 0.6, ["*", 0.04, ["coalesce", ["get", "w"], 6]]],
    14, ["+", 1.2, ["*", 0.35, ["coalesce", ["get", "w"], 6]]],
    17, ["*", 1.6, ["coalesce", ["get", "w"], 6]]];
  const casingWidth = ["interpolate", ["linear"], ["zoom"],
    10, ["+", 2.1, ["*", 0.04, ["coalesce", ["get", "w"], 6]]],
    14, ["+", 2.7, ["*", 0.35, ["coalesce", ["get", "w"], 6]]],
    17, ["+", 1.5, ["*", 1.6, ["coalesce", ["get", "w"], 6]]]];

  const map = new maplibregl.Map({
    container: "map",
    center: [30.24426335, 59.94182515],
    zoom: 12.5,
    minZoom: 9,
    maxZoom: 18,
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "© OpenStreetMap contributors"
        },
        roads: {
          type: "vector",
          url: "pmtiles://" + pmUrl,
          minzoom: 10,
          maxzoom: 16
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm",
          paint: { "raster-saturation": -0.85, "raster-opacity": 0.55 } },
        { id: "roads-casing", type: "line", source: "roads", "source-layer": "roads",
          filter: ["!=", ["coalesce", ["get", "tnl"], 0], 1],
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#ffffff",
                   "line-width": casingWidth, "line-opacity": 0.6 } },
        { id: "roads-line", type: "line", source: "roads", "source-layer": "roads",
          filter: ["!=", ["coalesce", ["get", "tnl"], 0], 1],
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": roadColor, "line-width": roadWidth } },
        { id: "roads-tunnel", type: "line", source: "roads", "source-layer": "roads",
          filter: ["==", ["coalesce", ["get", "tnl"], 0], 1],
          paint: { "line-color": roadColor, "line-width": roadWidth,
                   "line-dasharray": [2, 2], "line-opacity": 0.7 } }
      ]
    }
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");

  map.on("click", ["roads-line", "roads-tunnel"], (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`класс: <b>${p.r}</b><br>ширина: <b>${p.w} м</b>` +
               (p.tnl == 1 ? "<br>тоннель" : ""))
      .addTo(map);
  });
  map.on("mouseenter", "roads-line", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "roads-line", () => map.getCanvas().style.cursor = "");
</script>
</body>
</html>
